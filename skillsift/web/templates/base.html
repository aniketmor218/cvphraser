<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SkillSift{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('main.dashboard') }}">SkillSift</a>
    <nav>
      <a href="{{ url_for('main.dashboard') }}">Applications</a>
      <a href="{{ url_for('main.match') }}">New match</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Scores are guidance, not gatekeeping — apply anyway if you want the job.</footer>
</body>
</html>
